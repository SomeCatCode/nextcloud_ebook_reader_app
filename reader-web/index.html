<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <!-- The page only talks to its own origin (request proxy); section documents are blob: iframes that inherit this policy. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src blob:; style-src 'self' 'unsafe-inline' blob:; img-src 'self' blob: data:; media-src blob: data:; font-src 'self' blob: data:; connect-src 'self' blob:; frame-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Reader</title>
  <style>
    html, body, #reader { margin: 0; height: 100%; width: 100%; overflow: hidden; background: transparent; }
    html.eink * { transition: none !important; animation: none !important; }
    /* Comic zoom (src/gestures.ts): purely visual transform of the reader; the overlay receives all touches of comics */
    #reader { transform-origin: 0 0; }
    #gestures { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 1; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    #gestures[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="reader"></div>
  <div id="gestures" hidden></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>

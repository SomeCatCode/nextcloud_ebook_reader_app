# Dependabot opens pull requests against "dev" (feature flow: dev -> main).
# Security updates come as soon as an advisory exists. Version updates come once a week;
# minor and patch updates are grouped into one pull request per ecosystem to keep the noise low.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]

  # reader-web builds the reader bundle from reader-core of the server repo (git submodule).
  - package-ecosystem: npm
    directory: /reader-web
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]

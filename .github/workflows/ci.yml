name: CI

# Runs for pull requests to main (the release pull request) and on request (Actions -> CI -> Run workflow,
# or `gh workflow run ci.yml --ref <branch>`). The release workflow runs the same checks for every tag.
# Pushes and pull requests to dev do not start a run.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: reader-web/package-lock.json

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install NDK (native debug symbols for Play)
        run: |
          ndk=$(sed -n 's/^ *ndkVersion = "\(.*\)"/\1/p' app/build.gradle.kts)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
          ls -d "$ANDROID_HOME/ndk/$ndk"

      - name: Lint, unit tests, debug build (builds reader-web too)
        run: ./gradlew lint test assembleDebug --stacktrace

      - name: Native debug symbols for Play
        run: |
          ./gradlew :app:extractReleaseNativeSymbolTables --stacktrace
          if [ -z "$(find app/build/intermediates -path '*native_symbol_tables*' -name '*.sym' -print -quit)" ]; then
            echo "::error::AGP extracted no native symbol tables (NDK missing?); Play would show a warning"
            exit 1
          fi
          find app/build/intermediates -path '*native_symbol_tables*' -name '*.sym'

      - name: Upload debug APK (test build of a manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ebookreader-app-dev-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore

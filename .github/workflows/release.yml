name: Release

# Tag vX.Y.Z (or vX.Y.Z-rc.N) → signed AAB + APK, GitHub release, upload to Google Play.
# Manual run: pick the Play track/status for an existing tag (e.g. promote nothing, just re-upload).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: Play track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: Release status (an app that was never published only accepts "draft")
        type: choice
        options: [completed, draft]
        default: completed

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: play
    permissions:
      contents: write
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Version from tag
        id: version
        run: |
          ref="${GITHUB_REF_NAME}"
          if [[ ! "$ref" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-rc\.([0-9]+))?$ ]]; then
            echo "::error::Tag must look like v1.2.3 or v1.2.3-rc.4 (got '$ref')"; exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]} rc=${BASH_REMATCH[5]}
          if (( minor > 99 || patch > 99 || ${rc:-0} > 98 )); then
            echo "::error::minor/patch must be <= 99 and rc <= 98"; exit 1
          fi
          # monotonic: 1.2.3-rc.1 < 1.2.3-rc.2 < 1.2.3 < 1.2.4-rc.1
          code=$(( major * 1000000 + minor * 10000 + patch * 100 + ${rc:-99} ))
          echo "name=${ref#v}" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([[ -n "$rc" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "plain=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "versionName ${ref#v}, versionCode $code"

      - name: Require signing key
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::error::Secret ANDROID_KEYSTORE_BASE64 (environment 'play') is missing, see docs/RELEASING.md"
          exit 1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: reader-web/package-lock.json

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Tests, lint, signed AAB and APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Two runs: the APK (GitHub release) may show the donation link, the AAB for Google Play never does.
        run: |
          ./gradlew lint test assembleRelease --stacktrace             -PappVersionCode=${{ steps.version.outputs.code }}             -PappVersionName=${{ steps.version.outputs.name }}
          ./gradlew bundleRelease --stacktrace -PplayBuild=true             -PappVersionCode=${{ steps.version.outputs.code }}             -PappVersionName=${{ steps.version.outputs.name }}

      - name: Collect artifacts
        id: files
        run: |
          mkdir -p dist
          name="ebookreader-${{ steps.version.outputs.name }}"
          cp app/build/outputs/bundle/release/app-release.aab "dist/$name.aab"
          cp app/build/outputs/apk/release/app-release.apk "dist/$name.apk"
          cp app/build/outputs/mapping/release/mapping.txt "dist/$name-mapping.txt"
          (cd dist && sha256sum "$name.apk" "$name.aab" > "$name.sha256")
          # native debug symbols for Play (needs an NDK on the runner, AGP extracts them from the AndroidX .so files)
          if unzip -l "dist/$name.aab" | grep -q 'BUNDLE-METADATA/com.android.tools.build.debugsymbols/'; then
            echo "native debug symbols included"
          else
            echo "::warning::No native debug symbols in the AAB (NDK missing?); Play will show a warning"
          fi
          # the APK must be signed with the upload key (not the debug key)
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "dist/$name.apk" | head -3
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        run: |
          ver="${{ steps.version.outputs.plain }}"
          awk -v ver="$ver" '
            /^## / { if (found) exit; if ($0 ~ "^## \\[?" ver "\\]?( |$)") { found = 1; next } }
            found { print }
          ' CHANGELOG.md > dist/notes.md
          if [ ! -s dist/notes.md ]; then
            awk '/^## / { if (found) exit; if ($0 ~ /^## \[Unreleased\]/) { found = 1; next } } found { print }' CHANGELOG.md > dist/notes.md
          fi
          [ -s dist/notes.md ] || echo "Siehe CHANGELOG.md" > dist/notes.md
          # Play: plain text, max. 500 characters per language
          lang="${{ vars.PLAY_RELEASE_NOTES_LANG || 'de-DE' }}"
          mkdir -p dist/whatsnew
          grep -E '^\s*- ' dist/notes.md | sed -E 's/^\s*- /• /; s/\*\*//g; s/`//g; s/\[([^]]*)\]\([^)]*\)/\1/g' \
            | head -c 495 > "dist/whatsnew/whatsnew-$lang"
          [ -s "dist/whatsnew/whatsnew-$lang" ] || echo "Fehlerbehebungen und Verbesserungen" > "dist/whatsnew/whatsnew-$lang"
          cat "dist/whatsnew/whatsnew-$lang"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.files.outputs.name }}
          path: dist/
          if-no-files-found: error

      - name: GitHub release (APK for sideloading)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ steps.version.outputs.name }}
          body_path: dist/notes.md
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: |
            dist/${{ steps.files.outputs.name }}.apk
            dist/${{ steps.files.outputs.name }}.sha256

      - name: Upload to Google Play
        if: env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.somecatcode.ebookreader
          releaseFiles: dist/${{ steps.files.outputs.name }}.aab
          mappingFile: dist/${{ steps.files.outputs.name }}-mapping.txt
          whatsNewDirectory: dist/whatsnew
          track: ${{ inputs.track || vars.PLAY_TRACK || 'internal' }}
          status: ${{ inputs.status || vars.PLAY_RELEASE_STATUS || 'completed' }}
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})

      - name: Play upload skipped
        if: env.HAS_PLAY != 'true'
        run: echo "::warning::PLAY_SERVICE_ACCOUNT_JSON is not set, the AAB was not uploaded to Google Play (artifact only)."
